<header class="bg-pixelpc-primary py-3">
  <div class="container d-flex align-items-center justify-content-between flex-wrap gap-3">
    <a routerLink="/" class="navbar-brand text-accent fw-bold fs-4 text-decoration-none" dir="ltr">
      PixelPC
    </a>

    <nav class="d-flex align-items-center flex-wrap gap-4">
      @if (!isLoggedIn()) {
        <div class="d-flex align-items-center gap-3">
          <a routerLink="/login" class="nav-link-custom text-white text-decoration-none">
            تسجيل الدخول
          </a>
          <a routerLink="/register" class="btn btn-primary btn-sm">
            إنشاء حساب
          </a>
        </div>
      } @else if (isAdmin()) {
        <div class="d-flex align-items-center gap-5">
          <a routerLink="/admin" class="nav-link-custom text-white text-decoration-none d-flex align-items-center gap-1">
            <i class="bi bi-speedometer2 text-accent fs-5"></i>
            لوحة التحكم
          </a>
        </div>
        <div class="vr text-white opacity-25 d-none d-sm-block mx-2"></div>
        <button type="button" class="btn btn-outline-danger btn-sm" (click)="logout()">
          تسجيل الخروج
        </button>
      } @else {
        <div class="d-flex align-items-center gap-5">
          <a routerLink="/products" class="nav-link-custom text-white text-decoration-none">
            المنتجات
          </a>
          <a routerLink="/cart" class="nav-link-custom text-white text-decoration-none d-flex align-items-center gap-1">
            <i class="bi bi-cart3 text-accent fs-5"></i>
            السلة
            @if (cartItemCount() > 0) {
              <span class="badge rounded-pill bg-danger">{{ cartItemCount() }}</span>
            }
          </a>
          <a routerLink="/orders" class="nav-link-custom text-white text-decoration-none d-flex align-items-center gap-1">
            <i class="bi bi-person-circle text-accent fs-5"></i>
            طلباتي
          </a>
        </div>
        <div class="vr text-white opacity-25 d-none d-sm-block mx-2"></div>
        <button type="button" class="btn btn-outline-danger btn-sm" (click)="logout()">
          تسجيل الخروج
        </button>
      }
    </nav>
  </div>
</header>
